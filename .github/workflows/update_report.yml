name: Auto Update TAIFEX Report

on:
  schedule:
    # 每天早上 06:30 (台灣時間) 自動執行 (UTC 時間為前一天的 22:30)
    # 此時夜盤已收盤且盤後法人數據已公布
    - cron: '30 22 * * *'
  workflow_dispatch: # 允許在 GitHub 網頁上手動點擊執行

permissions:
  contents: write

jobs:
  update-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run scraper
        run: |
          python scraper_and_report.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "blairan121122885@gmail.com"
          git config --local user.name "blairan"
          git config core.autocrlf false
          # 先新增 HTML 檔案
          git add daily_report.html index.html
          # 檢查是否有變更要提交
          if git diff --staged --quiet; then
            echo "沒有新的資料更新"
            exit 0
          fi
          # 先 commit 本地變更
          git commit -m "$(date '+%Y-%m-%d') daily report update"
          # pull 並 rebase 遠端變更
          git pull --rebase origin main
          # push 到遠端
          git push
